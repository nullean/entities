name: CI

# Pull requests and pushes to main build, test, pack and validate. A tag (X.Y.Z or X.Y.Z-pre.N) also publishes the ten packages to nuget.org
# and creates the GitHub release. See RELEASING.md.
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - run: git fetch --prune --tags
        shell: bash

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # build, every test project on every target framework, then pack and validate the ten packages
      - name: Build, test, pack
        run: ./build.sh pack

  # The core and Reactive packages claim to be trim and AOT clean: publish the smoke app NativeAOT on each OS and run it.
  aot:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Publish and run the AOT smoke app
        run: dotnet run --project build/scripts -- aot

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, aot]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # An environment named "nuget" can require a reviewer before this job runs. Without one configured, the job just runs.
    environment: nuget
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - run: git fetch --prune --tags
        shell: bash

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # the build job tested this commit; pack it again here (MinVer gives the same version) and check the packages before anything is pushed
      - name: Build, pack and validate
        run: |
          ./build.sh build -s true
          ./build.sh generatepackages -s true
          ./build.sh validatepackages -s true

      - name: Public API changes since the previous release
        run: ./build.sh generateapichanges -s true

      - name: Publish to nuget.org
        run: dotnet nuget push '.artifacts/build-output/*.nupkg' -k ${{ secrets.NUGET_ORG_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate

      # last, so a release is announced only once its packages are out; a failed run can be re-run (--skip-duplicate). The notes are the draft release-drafter
      # kept from the merged pull requests; publishing it for this tag makes it the release.
      - name: Publish the GitHub release
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          tag: ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          publish: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # the public API changes go on the release itself, after the notes
      - name: Add the public API changes to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          changes=(.artifacts/build-output/breaking-changes-*.md)
          if [ ${#changes[@]} -eq 0 ]; then
            echo "no public API changes to add"
            exit 0
          fi
          gh release view "$TAG" --json body --jq .body > release-body.md
          for f in "${changes[@]}"; do
            printf '\n\n' >> release-body.md
            cat "$f" >> release-body.md
          done
          gh release edit "$TAG" --notes-file release-body.md
