name: CI

# Pull requests and pushes to main build, test, pack and validate. Publishing the release-drafter draft (web UI, phone
# or `mise run release publish`) creates the tag and fires `release: published`: every job runs again on the released
# commit, then the release job publishes every package to nuget.org. nuget.org's trusted publishing policy names this
# file, so the release has to run from it. Pushing a tag on its own publishes nothing. See RELEASING.md.
on:
  pull_request:
  push:
    branches:
      - main
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - run: git fetch --prune --tags
        shell: bash

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false # this workflow publishes what these jobs build; never restore a cache a PR could have written
        env:
          MISE_JOBS: "1" # dotnet versions share one DOTNET_ROOT; installing them in parallel races

      # build, every test project on every target framework, then pack and validate every package
      - name: Build, test, pack
        run: mise run ci

  # The core and Reactive packages claim to be trim and AOT clean: publish the smoke app NativeAOT on each OS and run it.
  aot:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false # this workflow publishes what these jobs build; never restore a cache a PR could have written
        env:
          MISE_JOBS: "1" # dotnet versions share one DOTNET_ROOT; installing them in parallel races

      - name: Publish and run the AOT smoke app
        run: dotnet run --project build/scripts -- aot

  release:
    if: github.event_name == 'release'
    needs: [build, aot]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # An environment named "nuget" can require a reviewer before this job runs. Without one configured, the job just runs.
    # The trusted publishing policy names this environment, so it stays.
    environment: nuget
    permissions:
      contents: write   # append the public API changes to the release notes
      id-token: write   # NuGet trusted publishing: exchange the workflow's OIDC token for a short-lived key

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
          fetch-depth: 0

      - run: git fetch --prune --tags
        shell: bash

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false # a release never restores a cache PR builds could have written
        env:
          MISE_JOBS: "1" # dotnet versions share one DOTNET_ROOT; installing them in parallel races

      # the build job tested this commit; pack it again here (MinVer gives the same version) and check the packages before anything is pushed
      - name: Build, pack and validate
        run: |
          ./build.sh build -s
          ./build.sh generatepackages -s
          ./build.sh validatepackages -s

      - name: Public API changes since the previous release
        run: ./build.sh generateapichanges -s

      # Trusted publishing: nuget.org trusts this repository's ci.yml in the nuget environment (a policy
      # owned by the nullean organization), so there is no long-lived API key to expire. The key it returns lasts an hour, so the
      # login sits right before the push. NUGET_USER is the nuget.org profile name, set at the org level.
      - name: Log in to nuget.org (trusted publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push '.artifacts/build-output/*.nupkg' -k "$NUGET_API_KEY" -s https://api.nuget.org/v3/index.json --skip-duplicate

      # After the push, so the notes gain the API changes only once the packages are out. The notes themselves are the
      # draft release-drafter kept from the merged pull requests; publishing it is what started this run. A re-run
      # (--skip-duplicate above) appends nothing twice.
      - name: Append the public API changes to the release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          files=(.artifacts/build-output/breaking-changes-*.md)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no public API changes to add"
            exit 0
          fi
          notes=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          marker="<!-- public-api-changes -->"
          case "$notes" in *"$marker"*) echo "already appended"; exit 0 ;; esac
          {
            printf '%s\n\n%s\n' "$notes" "$marker"
            for f in "${files[@]}"; do printf '\n'; cat "$f"; printf '\n'; done
          } > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"

  # Static analysis of these workflows (nullean/.github).
  zizmor:
    uses: nullean/.github/.github/workflows/zizmor.yml@d850ce6eee9efa9f81b410d15fcd480409518d19 # v1.5.0
    permissions:
      contents: read

  # Builds the documentation as the docs workflow deploys it (design-system layout, theme, landing page), so a pull
  # request that breaks the docs build or scripts/docs-finish.sh fails here rather than on main.
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The design-system layout is behind a feature flag, read from the environment only.
      - name: Build documentation
        uses: elastic/docs-builder@036a375759d876e2df67955ebec0382cd6b09249 # v1
        env:
          FEATURE_NAVIGATION_PREVIEW: true

      - name: Theme and landing page
        run: scripts/docs-finish.sh .artifacts/docs/html
