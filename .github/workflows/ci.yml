name: CI

# Pull requests and pushes to main build, test, pack and validate. A tag (X.Y.Z or X.Y.Z-pre.N) also publishes every package to nuget.org
# and creates the GitHub release. See RELEASING.md.
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - run: git fetch --prune --tags
        shell: bash

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false # this workflow publishes what these jobs build; never restore a cache a PR could have written
        env:
          MISE_JOBS: "1" # dotnet versions share one DOTNET_ROOT; installing them in parallel races

      # build, every test project on every target framework, then pack and validate every package
      - name: Build, test, pack
        run: mise run ci

  # The core and Reactive packages claim to be trim and AOT clean: publish the smoke app NativeAOT on each OS and run it.
  aot:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false # this workflow publishes what these jobs build; never restore a cache a PR could have written
        env:
          MISE_JOBS: "1" # dotnet versions share one DOTNET_ROOT; installing them in parallel races

      - name: Publish and run the AOT smoke app
        run: dotnet run --project build/scripts -- aot

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, aot]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # An environment named "nuget" can require a reviewer before this job runs. Without one configured, the job just runs.
    environment: nuget
    permissions:
      contents: write
      pull-requests: read
      id-token: write   # NuGet trusted publishing: exchange the workflow's OIDC token for a short-lived key

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - run: git fetch --prune --tags
        shell: bash

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false # a release never restores a cache PR builds could have written
        env:
          MISE_JOBS: "1" # dotnet versions share one DOTNET_ROOT; installing them in parallel races

      # the build job tested this commit; pack it again here (MinVer gives the same version) and check the packages before anything is pushed
      - name: Build, pack and validate
        run: |
          ./build.sh build -s true
          ./build.sh generatepackages -s true
          ./build.sh validatepackages -s true

      - name: Public API changes since the previous release
        run: ./build.sh generateapichanges -s true

      # Trusted publishing: nuget.org trusts this repository's ci.yml in the nuget environment (a policy
      # owned by the nullean organization), so there is no long-lived API key to expire. The key it returns lasts an hour, so the
      # login sits right before the push. NUGET_USER is the nuget.org profile name, set at the org level.
      - name: Log in to nuget.org (trusted publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push '.artifacts/build-output/*.nupkg' -k "$NUGET_API_KEY" -s https://api.nuget.org/v3/index.json --skip-duplicate

      # last, so a release is announced only once its packages are out; a failed run can be re-run (--skip-duplicate). The notes are the draft release-drafter
      # kept from the merged pull requests; publishing it for this tag makes it the release.
      - name: Publish the GitHub release
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          tag: ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          publish: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # the public API changes go on the release itself, after the notes
      - name: Add the public API changes to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          changes=(.artifacts/build-output/breaking-changes-*.md)
          if [ ${#changes[@]} -eq 0 ]; then
            echo "no public API changes to add"
            exit 0
          fi
          gh release view "$TAG" --json body --jq .body > release-body.md
          for f in "${changes[@]}"; do
            printf '\n\n' >> release-body.md
            cat "$f" >> release-body.md
          done
          gh release edit "$TAG" --notes-file release-body.md

  # Static analysis of these workflows (nullean/.github).
  zizmor:
    uses: nullean/.github/.github/workflows/zizmor.yml@09af1fa16762b8ae42d899d45430a4267df5300c # v1.2.0
    permissions:
      contents: read

  # Builds the documentation as the docs workflow deploys it (design-system layout, theme, landing page), so a pull
  # request that breaks the docs build or scripts/docs-finish.sh fails here rather than on main.
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The design-system layout is behind a feature flag, read from the environment only.
      - name: Build documentation
        uses: elastic/docs-builder@036a375759d876e2df67955ebec0382cd6b09249 # v1
        env:
          FEATURE_NAVIGATION_PREVIEW: true

      - name: Theme and landing page
        run: scripts/docs-finish.sh .artifacts/docs/html
