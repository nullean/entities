name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      # The design-system layout is behind a feature flag, read from the environment only.
      - name: Build documentation
        uses: elastic/docs-builder@main
        env:
          FEATURE_NAVIGATION_PREVIEW: true

      # The same post-build steps as scripts/docs.sh: the theme, root links, the animated header lockup, the landing
      # page (a standalone directory: index.html plus its css, js and assets, copied over the output), robots.txt, fonts.
      - name: Theme and landing page
        run: scripts/docs-finish.sh .artifacts/docs/html

      # The film (reels/) is a release asset, not a file in the repository: put it where the landing page plays it.
      - name: Film
        env:
          GH_TOKEN: ${{ github.token }}
        # Without the release the site still deploys; the landing page shows the film's poster.
        run: |
          gh release download film --repo "$GITHUB_REPOSITORY" --pattern entities.mp4 --dir .artifacts/docs/html/film \
            || echo "::warning::no film release: the landing page will show only the poster"

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .artifacts/docs/html

      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
