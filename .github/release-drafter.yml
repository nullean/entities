# https://github.com/release-drafter/release-drafter?tab=readme-ov-file#configuration-options
# The release notes are drafted from pull request labels as they merge to main; publishing the draft releases (the
# release job in .github/workflows/ci.yml, see RELEASING.md).
#
# 0.x rule: `breaking` bumps the minor version, never the major. Going to 1.0 is a manual decision: edit the draft's
# tag to 1.0.0 when publishing, then move `breaking` from minor to a `major:` resolver (the breaking-changes skill).
template: |
  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...$RESOLVED_VERSION
name-template: 'Nullean.Entities $RESOLVED_VERSION'
tag-template: '$RESOLVED_VERSION'
change-template: '- $TITLE by @$AUTHOR in #$NUMBER'
categories:
  - title: '💥 Breaking Changes'
    labels:
      - 'breaking' # When a breaking change is introduced
  - title: '✨ Features'
    labels:
      - 'feature' # When a new feature is introduced
      - 'enhancement' # When an existing feature is improved
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug' # When a bug is fixed
      - 'fix' # When a bug is fixed
  - title: '📝 Documentation'
    labels:
      - 'documentation' # When documentation is updated
  - title: '🧰 Maintenance'
    labels:
      - 'chore' # When a chore is done
      - 'dependencies' # When dependencies are updated
  - title: '⚙️ Automation'
    labels:
      - 'ci' # When build or automation is updated
exclude-labels:
  - 'changelog:skip' # When a PR should be excluded from the changelog
version-resolver:
  minor:
    labels:
      - 'breaking'
      - 'feature'
      - 'enhancement'
  default: patch
