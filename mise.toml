# Bootstraps the toolchain and is the one entry point: `mise run <task>`, the same task names in every nullean repo.
# The .NET SDK version lives only in global.json: the first dotnet entry reads it from there (sdk.version is the first
# "version" key). The net10.0 runtime is listed after it because every package and test project targets net10.0 too.

[env]
DOTNET_NOLOGO = "1"
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_SKIP_FIRST_TIME_EXPERIENCE = "1"

[tools]
dotnet = ["""{{ read_file(path='global.json') | split(pat='"version"') | nth(n=1) | split(pat='"') | nth(n=1) }}""", "10"]
gh = "latest"
zizmor = "1"

[tasks.setup]
description = "Restore the local .NET tools"
# On a cold NuGet cache `dotnet tool restore` can report husky as "not contained in the package" (it reads curb's
# commands instead) while restoring every other tool; the second run, with the packages cached, restores all of them.
run = "dotnet tool restore || dotnet tool restore"

[tasks.build]
description = "Build the solution"
depends = ["setup"]
run = "dotnet run --project build/scripts -- build"

[tasks.test]
description = "Build, run the example apps, then run every test project on every target framework"
depends = ["setup"]
run = "dotnet run --project build/scripts -- test"

[tasks.format]
description = "Format the repository with curb"
depends = ["setup"]
run = "dotnet curb format ."

[tasks.check]
description = "Fail on formatting drift (curb) and on workflow findings (zizmor)"
depends = ["setup"]
run = ["dotnet curb check .", "zizmor --min-severity medium ."]

[tasks.pack]
description = "Build, pack the NuGet packages and validate them"
depends = ["setup"]
run = [
  "dotnet run --project build/scripts -- build",
  "dotnet run --project build/scripts -- generatepackages -s true",
  "dotnet run --project build/scripts -- validatepackages -s true",
]

[tasks.docs]
description = "Build the docs, apply the landing page override, and serve them"
run = "dotnet run --project build/scripts -- docs"

[tasks.clean]
description = "Delete build output"
run = "dotnet run --project build/scripts -- clean"

[tasks.ci]
description = "What CI's build job runs: test, pack and validate every package, then the curb formatting check"
depends = ["setup"]
run = ["dotnet run --project build/scripts -- pack", "dotnet curb check ."]

[tasks.release]
description = "Open the release-drafter draft; `mise run release publish` publishes it, which releases"
run = '''
#!/usr/bin/env bash
set -euo pipefail
tag=$(gh release list --json tagName,isDraft --jq '[.[] | select(.isDraft)][0].tagName')
if [ -z "$tag" ]; then
  echo "no draft release; merge a labelled pull request to main first" >&2
  exit 1
fi
if [ "${1:-}" = "publish" ]; then
  gh release edit "$tag" --draft=false
  echo "published $tag; the release workflow is now packing and pushing it"
else
  gh release view "$tag"
  echo
  echo "publish with: mise run release publish   (or promote the draft on github.com)"
fi
'''
